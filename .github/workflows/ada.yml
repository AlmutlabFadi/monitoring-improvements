name: Ada (GNAT)

on:
  push:
    branches: [ "devin/1733446916-monitoring-improvements" ]
  pull_request:
    branches: [ "devin/1733446916-monitoring-improvements" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up GNAT toolchain
      run: >
        sudo apt-get update &&
        sudo apt-get install gnat gprbuild

    - name: Build
      run: gprbuild -j0 -p
